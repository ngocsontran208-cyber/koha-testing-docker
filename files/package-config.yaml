# Package configuration for KTD
# Structure: common packages use modern names + older distros override as needed

common:
  base:
    - apache2
    - build-essential
    - codespell
    - cpanminus
    - git
    - lsb-release
    - tig
    - libcarp-always-perl
    - libgit-repository-perl
    - libmemcached-tools
    - libmodule-install-perl
    - libperl-critic-perl
    - libtest-differences-perl
    - libtest-perl-critic-perl
    - libtest-perl-critic-progressive-perl
    - libfile-chdir-perl
    - libdata-printer-perl
    - pmtools
    - locales
    - netcat-openbsd
    - python3-gdbm
    - vim
    - nano
    - tmux
    - wget
    - curl
    - apt-transport-https
    - plocate
    - iproute2

  koha-dev:
    - perltidy
    - libexpat1-dev
    - libtemplate-plugin-gettext-perl
    - libdevel-cover-perl
    - libmoosex-attribute-env-perl
    - libtest-dbix-class-perl
    - libtap-harness-junit-perl
    - libtext-csv-unicode-perl
    - libdevel-cover-report-clover-perl
    - libwebservice-ils-perl
    - libselenium-remote-driver-perl
    - libperl-languageserver-perl

  nodejs:
    - nodejs
    - yarn

  utility:
    - bugz
    - inotify-tools

  cypress:
    - libgtk2.0-0t64
    - libgtk-3-0t64
    - libgbm-dev
    - libnotify-dev
    - libnss3
    - libxss1
    - libasound2t64
    - libxtst6
    - xauth
    - xvfb

  temp: []

  cpan:
    - Twiggy

distro_specific:
  # Older distros that still use legacy package names
  bookworm:
    base-overrides:
      plocate: mlocate
    cypress-overrides:
      libgtk2.0-0t64: libgtk2.0-0
      libgtk-3-0t64: libgtk-3-0
      libasound2t64: libasound2
    cypress:
      - libgconf-2-4

  jammy:
    base-overrides:
      netcat-openbsd: netcat
      python3-gdbm: python-gdbm
      plocate: mlocate
    koha-dev-overrides:
      libperl-languageserver-perl: null
    cypress-overrides:
      libgtk2.0-0t64: libgtk2.0-0
      libgtk-3-0t64: libgtk-3-0
      libasound2t64: libasound2
    cypress:
      - libgconf-2-4

  sid:
    base-overrides:
      python3-gdbm: python-gdbm
